services:
  ollama:
    image: ollama/ollama:latest
    container_name: collaboration-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  ollama-model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_REPORT_MODEL: ${OLLAMA_REPORT_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      ollama pull "$OLLAMA_REPORT_MODEL"
    restart: "no"

volumes:
  ollama_data:

